<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        margin: 0;
        width: 280px;
        font-family: Arial, sans-serif;
        background: #1e1e1e;
        color: #f0f0f0;
        padding: 16px;
        text-align: center;
      }

      .label-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 10px;
      }

      .label {
        display: flex;
        justify-content: space-around;
        margin-bottom: 16px;
      }

      .label {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .label span {
        font-size: 12px;
        color: #999;
      }

      .label strong {
        font-size: 16px;
        color: #f0f0f0;
      }

      .label #message {
        font-size: 14px;
        color: #f0f0f0;
        word-wrap: normal;
      }

      .buttons {
        display: flex;
        justify-content: space-around;
        gap: 10px;
        margin-bottom: 10px;
      }

      button {
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #3a3a3a;
        color: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #505050;
      }

      button:active {
        background: #606060;
      }

      .toggle.on {
        color: limegreen;
      }

      .toggle.off {
        color: red;
      }
    </style>
    <title>Counter</title>
  </head>

  <body>
    <div class="label-grid">
      <div class="label">
        <span>Collected</span>
        <strong id="collected-count">0/10</strong>
      </div>
      <div class="label">
        <span>Status</span>
        <strong id="status">Started</strong>
      </div>
      <div class="label">
        <span>Current</span>
        <strong id="current-time"></strong>
      </div>
      <div class="label">
        <span>Next</span>
        <strong id="next-time"></strong>
      </div>
    </div>
    <div class="label">
      <span>Message</span>
      <span id="message">No message.</span>
    </div>
    <div class="buttons">
      <button id="toggle-button">Toggle</button>
      <button id="force-claim-button">Force Claim</button>
    </div>
    <div class="buttons">
      <button id="check-alarm-button">Check Alarm</button>
      <button id="set-alarm-button">Force Set Alarm</button>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
