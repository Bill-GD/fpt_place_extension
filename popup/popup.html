<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        margin: 0;
        width: 280px;
        font-family: Arial, sans-serif;
        background: #1e1e1e;
        color: #f0f0f0;
        padding: 16px;
        text-align: center;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .counter {
        font-size: 48px;
        font-weight: bold;
        margin: 8px 0 16px;
      }

      .times {
        display: flex;
        justify-content: space-around;
        margin-bottom: 16px;
      }

      .times div {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .times span {
        font-size: 12px;
        color: #999;
      }

      .times strong {
        font-size: 16px;
        color: #f0f0f0;
      }

      .buttons {
        display: flex;
        justify-content: space-around;
        gap: 10px;
      }

      button {
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #3a3a3a;
        color: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #505050;
      }

      button:active {
        background: #606060;
      }

      .toggle.on {
        color: limegreen;
      }

      .toggle.off {
        color: red;
      }
    </style>
    <title>Counter</title>
  </head>

  <body>
    <div class="label">
      <h2>Counter</h2>
      <div class="counter">0</div>
    </div>
    <div class="times">
      <div><span>Current</span> <strong id="current-time">12:34:56</strong></div>
      <div><span>Next</span> <strong id="next-time">13:19:56</strong></div>
    </div>
    <div class="buttons">
      <button id="toggle-button">Toggle</button>
      <button id="action-button">Force Claim</button>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
